<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0F1117;overflow:hidden}
body{font-family:'Segoe UI','Tahoma','Geneva','Verdana','Arial',sans-serif;color:#f0f0f0;direction:rtl}
input,button,select{font-family:'Segoe UI','Tahoma','Geneva','Verdana','Arial',sans-serif}
::-webkit-scrollbar{width:0}
#app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#0F1117}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);padding:10px 22px;border-radius:50px;font-weight:700;font-size:13px;z-index:9999;white-space:nowrap;pointer-events:none;transition:all .3s;opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.s{background:#06D6A0;color:#000}
#toast.e{background:#FF6B6B;color:#fff}
#toast.w{background:#FFD166;color:#000}
.card{background:#1E2030;border-radius:16px;padding:14px;margin-bottom:10px}
.chip{background:#1E2030;border:1.5px solid transparent;border-radius:99px;padding:5px 13px;font-size:11px;color:#666;cursor:pointer;white-space:nowrap;font-family:Cairo,sans-serif}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:9px 0;font-size:12px;color:#555;cursor:pointer;font-family:Cairo,sans-serif}
.tab.on{color:#B8B5FF;border-bottom-color:#B8B5FF;font-weight:700}
.btn-main{width:100%;background:linear-gradient(135deg,#B8B5FF,#8B5CF6);border:none;border-radius:13px;padding:13px;font-size:14px;font-weight:800;color:#fff;cursor:pointer;font-family:Cairo,sans-serif}
.bar-t{background:#2A2D3E;border-radius:99px;height:8px;overflow:hidden;margin:5px 0}
.bar-f{height:100%;border-radius:99px;transition:width .5s}
.row{display:flex;align-items:center;justify-content:space-between}
.irow{display:flex;align-items:center;justify-content:space-between;background:#1E2030;border-radius:13px;padding:10px 12px;margin-bottom:7px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.nk{border-radius:13px;padding:16px 0;font-size:21px;font-weight:700;cursor:pointer;border:1.5px solid #2A2D3E;background:#1E2030;color:#fff;font-family:Cairo,sans-serif}
.nk.del{background:#FF6B6B22;border-color:#FF6B6B55;color:#FF6B6B;font-size:20px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#151720;border-radius:20px 20px 0 0;padding:20px 20px 100px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto}
.inp{width:100%;background:#1E2030;border:1.5px solid #2A2D3E;border-radius:11px;padding:11px 13px;font-size:14px;color:#fff;outline:none;font-family:Cairo,sans-serif;margin-bottom:10px}
.lbl{font-size:11px;color:#666;margin-bottom:6px;display:block}
.lock-banner{background:linear-gradient(135deg,#2a1010,#1a0808);border:1.5px solid #FF6B6B44;border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
#bottom-nav{display:flex;background:#151720;border-top:1px solid #1E2030;padding:0;flex-shrink:0}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 12px;font-size:9px;color:#444;cursor:pointer;border:none;background:none;font-family:Cairo,sans-serif;gap:3px;transition:color .2s;border-top:2px solid transparent}
.bnav.on{color:#B8B5FF;border-top-color:#B8B5FF}
.bnav .icon{font-size:20px}
.person-card{background:#1E2030;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;transition:background .2s}
.person-card:active{background:#252840}
.person-card .accent-bar{position:absolute;right:0;top:0;bottom:0;width:4px;border-radius:0 16px 16px 0}
.tx-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #2A2D3E}
.tx-row:last-child{border-bottom:none}
.tx-badge{min-width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700}
.chip.selected{border-color:#B8B5FF;color:#B8B5FF;background:#B8B5FF15}
.month-select{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.month-select .chip{cursor:pointer;user-select:none}
</style>

<body>
<div id="app">
  <div id="main"></div>
  <div id="bottom-nav">
    <button class="bnav on" id="bnav-budget" onclick="setPage('budget')"><span class="icon">💰</span>الميزانية</button>

<script>
// ── DATA ──────────────────────────────────────────────────
var SK="masarifi_v1";
var APP=(function(){try{var r=localStorage.getItem(SK);if(r){var p=JSON.parse(r);if(!p.persons)p.persons=[];if(!p.recurring)p.recurring=[];return p;}}catch(e){}return{currency:"MAD",months:{},persons:[],recurring:[]};})();

function save(){try{localStorage.setItem(SK,JSON.stringify(APP));}catch(e){toast("تعذر الحفظ!","e");}}

var DC=[
  {id:"darts",label:"جمعية",amount:5000,icon:"🎯",color:"#FF8B94",skipMonths:[]},
  {id:"charge_m",label:"مصاريف الشهر",amount:3500,icon:"🛒",color:"#FFE66D",skipMonths:[]},
  {id:"reddad",label:"مصاريف رداد",amount:3500,icon:"👤",color:"#B8B5FF",skipMonths:[]},
  {id:"home_crd",label:"قرض السكن",amount:2632,icon:"🏠",color:"#FF6B6B",skipMonths:[]},
  {id:"parent",label:"إعطاء الوالدين",amount:1000,icon:"❤️",color:"#FF8B94",skipMonths:[]},
  {id:"ecole",label:"مدرسة مد-ياسر",amount:950,icon:"🎓",color:"#A8E6CF",skipMonths:["07","08"]},
  {id:"internet",label:"الإنترنت",amount:250,icon:"📶",color:"#4ECDC4",skipMonths:[]},
  {id:"rak",label:"الراك (الماء والكهرباء)",amount:230,icon:"💡",color:"#06D6A0",skipMonths:[]},
  {id:"assurance",label:"تأمين السيارة",amount:4500,icon:"🚗",color:"#FF6B6B",skipMonths:[],onlyMonths:["03"]},
  {id:"vignette",label:"ملصق داستر",amount:700,icon:"📋",color:"#FFD166",skipMonths:[],onlyMonths:["01"]}
];
var DI=[
  {id:"sal",label:"الراتب",amount:21128,icon:"💼",color:"#06D6A0"},
  {id:"child",label:"تعويض الأطفال",amount:900,icon:"👶",color:"#74B9FF"}
];
var ICONS=["📦","🚗","🛒","💊","🎓","🍽️","❤️","🏦","📄","💡","📶","🎯","💰","🔧","⚽","👕","✈️","🎬","🏠","💳","🌿","⛽","🏥","📱","🎁","💼","👶","🏗️"];
var COLS=["#FF6B6B","#4ECDC4","#FFE66D","#B8B5FF","#A8E6CF","#FF8B94","#06D6A0","#FFDAB9","#FFD166","#74B9FF","#fd79a8","#00cec9"];
var CURRS=["MAD","DZD","TND","SAR","AED","USD","EUR"];
var PAVS=["👨","👩","👦","👧","🧑","👴","👵","🧔","🙋","👨‍💼","👩‍💼","🫂","🤝","👫","👬","👭","💁","😊"];
var PCOLS=["#B8B5FF","#06D6A0","#FFD166","#FF8B94","#74B9FF","#A8E6CF","#FF6B6B","#4ECDC4","#fd79a8","#FFDAB9"];

// ── MONTH HELPERS ─────────────────────────────────────────
function tm(){var d=new Date();if(d.getDate()>=27)d.setMonth(d.getMonth()+1);return d.getFullYear()+"-"+(d.getMonth()<9?"0":"")+(d.getMonth()+1);}
function addMonths(mk,n){var p=mk.split("-");var d=new Date(parseInt(p[0]),parseInt(p[1])-1+n,1);return d.getFullYear()+"-"+(d.getMonth()<9?"0":"")+(d.getMonth()+1);}
function mkCmp(a,b){return a<b?-1:a>b?1:0;}
function isPrevMonthLocked(){return new Date().getDate()>27;}
function prevBudgetMonth(){return addMonths(tm(),-1);}
function isMonthLocked(mk){var prev=prevBudgetMonth();if(mk===prev&&isPrevMonthLocked())return true;if(mkCmp(mk,prev)<0)return true;return false;}
function visibleMonths(){var now=tm();var year=now.slice(0,4);var m=[];for(var i=1;i<=12;i++)m.push(year+"-"+(i<10?"0":"")+i);return m;}
function gen10Y(){var k=[],d=new Date(2024,0,1);for(var i=0;i<144;i++){k.push(d.getFullYear()+"-"+(d.getMonth()<9?"0":"")+(d.getMonth()+1));d.setMonth(d.getMonth()+1);}return k;}
var ALL=gen10Y();
function td(){return new Date().toISOString().slice(0,10);}
function mlabel(mk){var p=mk.split("-");return new Date(p[0],p[1]-1,1).toLocaleDateString("ar-MA",{month:"long",year:"numeric"});}
function mshort(mk){return new Date(mk+"-01").toLocaleDateString("ar-MA",{month:"short",year:"2-digit"});}
function getDeficit(mk){var prev=addMonths(mk,-1);if(!APP.months[prev])return 0;var pm=APP.months[prev];var ti=pm.incomes.reduce(function(s,i){return s+i.amount;},0);var tc=pm.charges.reduce(function(s,c){return s+c.amount;},0);var surp=ti-tc;return surp<0?Math.abs(surp):0;}
function newMonth(mk){
  var mo=mk?(mk.split("-")[1]):"00";
  var charges=[];
  // المصاريف الثابتة من DC
  DC.forEach(function(c){
    if(c.skipMonths&&c.skipMonths.indexOf(mo)!==-1)return;
    if(c.onlyMonths&&c.onlyMonths.indexOf(mo)===-1)return;
    charges.push({id:c.id,label:c.label,amount:c.amount,icon:c.icon,color:c.color,paid:false});
  });
  // المصاريف المتكررة المضافة من المستخدم
  if(APP.recurring){
    APP.recurring.forEach(function(rec){
      if(mkCmp(mk, rec.startMonth) < 0) return; // لا نضيف قبل شهر البداية
      var add = false;
      if(rec.type === "monthly") {
        var recYear = rec.startMonth.split("-")[0];
        var mkYear = mk.split("-")[0];
        add = (mkYear === recYear);
      }
      else if(rec.type === "yearly") { var targetMo = rec.yearlyMonth || rec.startMonth.split("-")[1]; add = (mo === targetMo); }
      else if(rec.type === "months") {
        var recYear2 = rec.startMonth.split("-")[0];
        var mkYear2 = mk.split("-")[0];
        add = (mkYear2 === recYear2 && rec.months && rec.months.indexOf(mo) !== -1);
      }
      if(add){
        charges.push({
          id: rec.id + "_" + mk,
          label: rec.label,
          amount: rec.amount,
          icon: rec.icon,
          color: rec.color,
          paid: false,
          recurringId: rec.id
        });
      }
    });
  }
  return {incomes:DI.map(function(i){return{id:i.id,label:i.label,amount:i.amount,icon:i.icon,color:i.color};}),charges:charges,savings:0};
}
function gm(k){if(!APP.months[k])APP.months[k]=newMonth(k);var m=APP.months[k];m.incomes=m.incomes.filter(function(i){return i.id!=="deficit_deduct";});var d=getDeficit(k);if(d>0)m.incomes.push({id:"deficit_deduct",label:"عجز الشهر السابق (مُرحّل)",amount:-d,icon:"⚠️",color:"#FF6B6B"});return m;}

// ── PASSWORD ──────────────────────────────────────────────
var PWD_KEY="masarifi_pwd",UNLOCK_KEY="masarifi_unlocked";
function getPwd(){return localStorage.getItem(PWD_KEY)||"";}
function setPwdStore(p){localStorage.setItem(PWD_KEY,p);}
function removePwd(){localStorage.removeItem(PWD_KEY);}
function isUnlocked(){if(!getPwd())return true;return sessionStorage.getItem(UNLOCK_KEY)==="1";}
function setUnlocked(){sessionStorage.setItem(UNLOCK_KEY,"1");}
function reLock(){sessionStorage.removeItem(UNLOCK_KEY);}

// ── STATE ─────────────────────────────────────────────────
var curPage="budget";
var curM=tm();
var curTab="charges";
var _needScrollChip=true;
var modal=null;
var pendingDelId=null,pendingDelType=null;
var numVal="",numLabel="",numIcon="📦",numCol="#B8B5FF",numStep="info";
var editId=null,editType=null;
var pwdVal="",pwdMode="",pwdOldOk=false;

// تكرار المصروف الجديد
var recurType = "none"; // "none", "monthly", "yearly", "months"
var recurMonths = []; // للأشهر المحددة
var recurYearlyMonth = ""; // الشهر المحدد للتكرار السنوي

// ── SULAF STATE ───────────────────────────────────────────
var sulafView="list";
var sulafPersonId=null;
var sulafModal=null;
var spName="",spAvatar="👨",spColor="#B8B5FF",spEditId=null;
var txType="lend",txAmount="",txNote="",txDate=td();
var pendingDelPid=null,pendingDelTxId=null;

// ── TOAST ─────────────────────────────────────────────────
var _tt;
function toast(msg,type){var el=document.getElementById("toast");el.textContent=msg;el.className="on "+(type||"s");clearTimeout(_tt);_tt=setTimeout(function(){el.className="";},2400);}

// ── AUTO BACKUP ───────────────────────────────────────────
function autoBackup(){try{var last=localStorage.getItem("masarifi_bk");var now=new Date();var key=now.getFullYear()+"-"+now.getMonth();if(last===key||Object.keys(APP.months).length===0)return;var blob=new Blob([JSON.stringify(APP,null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="masarifi_auto_"+now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate()+".json";a.click();URL.revokeObjectURL(url);localStorage.setItem("masarifi_bk",key);toast("تم النسخ الاحتياطي التلقائي ✓");}catch(e){}}

// ── LOCK GUARD ────────────────────────────────────────────
function guardLocked(){if(!isMonthLocked(curM))return false;if(isUnlocked())return false;pwdVal="";pwdMode="unlock";modal="pwd";render();return true;}

// ── PAGE NAVIGATION ───────────────────────────────────────
function setPage(p){
  curPage=p;
  if(p==="sulaf"){sulafView="list";sulafPersonId=null;sulafModal=null;}
  modal=null;
  document.querySelectorAll(".bnav").forEach(function(b){b.classList.remove("on");});
  var btn=document.getElementById("bnav-"+p);
  if(btn)btn.classList.add("on");
  render();
}

// ── RENDER ────────────────────────────────────────────────
function render(){
  var el=document.getElementById("main");
  var st=el.scrollTop;
  el.innerHTML=curPage==="sulaf"?pageSulaf():pageBudget();
  el.scrollTop=st;
  if(_needScrollChip){scrollCurChip();_needScrollChip=false;}
}

function scrollCurChip(){
  var chip=document.getElementById("chip-cur");
  if(chip)chip.scrollIntoView({inline:"center",behavior:"smooth",block:"nearest"});
}

// ── SULAF HELPERS ─────────────────────────────────────────
function getPerson(id){return APP.persons.find(function(p){return p.id===id;})||null;}
function balance(p){
  return (p.transactions||[]).reduce(function(s,tx){
    if(tx.type==="lend")return s+tx.amount;
    if(tx.type==="borrow")return s-tx.amount;
    if(tx.type==="settle")return s+tx.settled;
    return s;
  },0);
}
function sulafSummary(){
  var owed=0,owing=0;
  APP.persons.forEach(function(p){var b=balance(p);if(b>0)owed+=b;else owing+=Math.abs(b);});
  return{owed:owed,owing:owing};
}
function fmtDate(iso){
  if(!iso)return"";
  try{return new Date(iso).toLocaleDateString("ar-MA",{day:"2-digit",month:"2-digit",year:"numeric"});}catch(e){return iso;}
}

// ── SULAF PAGE ────────────────────────────────────────────
function pageSulaf(){
  if(sulafView==="detail"&&sulafPersonId)return pageDetail();
  return pageList();
}

function pageList(){
  var cur=APP.currency;
  var sm=sulafSummary();
  var h="";
  h+='<div style="background:linear-gradient(160deg,#1a1d2e,#0F1117);padding:48px 20px 16px">';
  h+='<div style="font-size:22px;font-weight:900;margin-bottom:2px">🤝 السلف</div>';
  h+='<div style="font-size:11px;color:#555;margin-bottom:16px">تتبع من يدينك ومن أنت مدين له</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
  h+='<div class="card" style="margin-bottom:0;background:#0a1f0a;border:1px solid #06D6A022">';
  h+='<div style="font-size:10px;color:#555;margin-bottom:3px">💚 يدينون لك</div>';
  h+='<div style="font-size:20px;font-weight:900;color:#06D6A0">'+sm.owed.toLocaleString()+'</div>';
  h+='<div style="font-size:9px;color:#444">'+cur+'</div></div>';
  h+='<div class="card" style="margin-bottom:0;background:#1f0a0a;border:1px solid #FF6B6B22">';
  h+='<div style="font-size:10px;color:#555;margin-bottom:3px">❤️ أنت مدين</div>';
  h+='<div style="font-size:20px;font-weight:900;color:#FF8B94">'+sm.owing.toLocaleString()+'</div>';
  h+='<div style="font-size:9px;color:#444">'+cur+'</div></div>';
  h+='</div>';
  h+='<button onclick="openSulafModal(\'addPerson\')" style="width:100%;background:#1E2030;border:1.5px dashed #B8B5FF55;border-radius:13px;padding:11px;color:#B8B5FF;font-size:13px;cursor:pointer;font-family:Cairo,sans-serif">+ إضافة شخص</button>';
  h+='</div>';
  h+='<div style="padding:12px 20px">';
  if(APP.persons.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';
    h+='<div style="font-size:52px;margin-bottom:14px;opacity:.25">🤝</div>';
    h+='<div style="font-size:14px;color:#444">لا يوجد أشخاص بعد</div>';
    h+='<div style="font-size:11px;color:#333;margin-top:6px">أضف شخصاً لتبدأ بتتبع السلف</div></div>';
  } else {
    var sorted=APP.persons.slice().sort(function(a,b){return Math.abs(balance(b))-Math.abs(balance(a));});
    sorted.forEach(function(p){
      var bal=balance(p);
      var bc=bal>0?"#06D6A0":bal<0?"#FF8B94":"#555";
      var txCount=(p.transactions||[]).length;
      var balLabel=bal>0?"يدينك":bal<0?"أنت مدين":"مسدد ✓";
      h+='<div class="person-card" onclick="openDetail(\''+p.id+'\')">';
      h+='<div class="accent-bar" style="background:'+p.color+'"></div>';
      h+='<div style="display:flex;align-items:center;gap:11px">';
      h+='<div style="width:44px;height:44px;border-radius:99px;background:'+p.color+'22;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">'+p.avatar+'</div>';
      h+='<div style="flex:1">';
      h+='<div style="font-size:14px;font-weight:800;color:#ddd">'+p.name+'</div>';
      h+='<div style="font-size:10px;color:#555;margin-top:2px">'+txCount+' معاملة &nbsp;•&nbsp; <span style="color:'+bc+'">'+balLabel+'</span></div>';
      h+='</div>';
      h+='<div style="text-align:left">';
      if(bal!==0){
        h+='<div style="font-size:17px;font-weight:900;color:'+bc+'">'+Math.abs(bal).toLocaleString()+'</div>';
        h+='<div style="font-size:9px;color:#444;text-align:left">'+cur+'</div>';
      } else {
        h+='<div style="font-size:22px;opacity:.25">✓</div>';
      }
      h+='</div></div></div>';
    });
  }
  h+='</div>';
  h+=buildSulafModal();
  return h;
}

function pageDetail(){
  var p=getPerson(sulafPersonId);
  if(!p){sulafView="list";sulafPersonId=null;return pageList();}
  var cur=APP.currency;
  var bal=balance(p);
  var bc=bal>0?"#06D6A0":bal<0?"#FF8B94":"#888";
  var txs=(p.transactions||[]).slice().reverse();
  var h="";
  h+='<div style="background:linear-gradient(160deg,#1a1d2e,#0F1117);padding:48px 20px 16px">';
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">';
  h+='<button onclick="sulafBack()" style="background:#1E2030;border:none;border-radius:99px;width:34px;height:34px;color:#888;cursor:pointer;font-size:17px;flex-shrink:0">←</button>';
  h+='<div style="width:40px;height:40px;border-radius:99px;background:'+p.color+'22;display:flex;align-items:center;justify-content:center;font-size:20px">'+p.avatar+'</div>';
  h+='<div style="flex:1"><div style="font-size:18px;font-weight:900">'+p.name+'</div>';
  h+='<div style="font-size:10px;color:#555">'+(p.transactions||[]).length+' معاملة</div></div>';

// ── SULAF ACTIONS ─────────────────────────────────────────
function openSulafModal(m,pid,tt){
  if(m==="addPerson"){spName="";spAvatar="👨";spColor="#B8B5FF";spEditId=null;}
  if(m==="editPerson"&&pid){var pp=getPerson(pid);if(pp){spName=pp.name;spAvatar=pp.avatar;spColor=pp.color;spEditId=pid;}}
  if(m==="addTx"){txAmount="";txNote="";txDate=td();if(tt)txType=tt;}
  if(pid)sulafPersonId=pid;
  sulafModal=m;render();
}
function closeSulafModal(){sulafModal=null;render();}
function bgClickSulaf(e){if(e.target===e.currentTarget){sulafModal=null;render();}}
function setSpAv(av){spAvatar=av;render();}
function setSpCol(c){spColor=c;render();}
function setTxType(t){txType=t;render();}
function nkTx(k){if(k==="⌫"){txAmount=txAmount.slice(0,-1);}else if(k==="."&&txAmount.includes(".")){return;}else if(txAmount.length>=9){return;}else{txAmount+=k;}render();}
function openDetail(pid){sulafPersonId=pid;sulafView="detail";render();}
function sulafBack(){sulafView="list";sulafPersonId=null;sulafModal=null;render();}
function savePerson(){
  if(!spName.trim()){toast("أدخل الاسم","e");return;}
  if(spEditId){
    APP.persons=APP.persons.map(function(p){
      if(p.id!==spEditId)return p;
      return Object.assign({},p,{name:spName.trim(),avatar:spAvatar,color:spColor});
    });
    toast("تم التعديل ✓");
  } else {
    APP.persons.push({id:Date.now()+"_"+Math.random().toString(36).slice(2),name:spName.trim(),avatar:spAvatar,color:spColor,transactions:[]});
    toast("تمت إضافة الشخص ✓");
  }
  save();sulafModal=null;render();
}
function saveTx(){
  var v=parseFloat(txAmount);
  if(isNaN(v)||v<=0){toast("أدخل مبلغاً صحيحاً","e");return;}
  var p=getPerson(sulafPersonId);
  if(!p){toast("خطأ","e");return;}
  if(!p.transactions)p.transactions=[];
  var rec={id:Date.now()+"_"+Math.random().toString(36).slice(2),type:txType,date:txDate||td(),note:txNote.trim()};
  if(txType==="settle"){
    var bal=balance(p);
    rec.settled=bal>0?-v:v;
    rec.amount=v;
  } else {
    rec.amount=v;
  }
  p.transactions.push(rec);
  save();sulafModal=null;
  var lbl=txType==="lend"?"تم تسجيل السلفة":txType==="borrow"?"تم تسجيل القرض":"تم تسجيل التسديد";
  toast(lbl+" ✓");render();
}
function askDelPerson(pid){pendingDelPid=pid;sulafModal="confirmDelPerson";render();}
function doDelPerson(){
  APP.persons=APP.persons.filter(function(p){return p.id!==pendingDelPid;});
  save();sulafModal=null;sulafView="list";sulafPersonId=null;
  toast("تم حذف الشخص","e");render();
}
function askDelTx(pid,txid){sulafPersonId=pid;pendingDelTxId=txid;sulafModal="confirmDelTx";render();}
function doDelTx(){
  var p=getPerson(sulafPersonId);
  if(p)p.transactions=(p.transactions||[]).filter(function(tx){return tx.id!==pendingDelTxId;});
  save();sulafModal=null;toast("تم حذف المعاملة","e");render();
}

// ── CALC HELPERS ─────────────────────────────────────────
function evalNumVal(){
  try{
    if(!numVal)return 0;
    var expr=numVal.replace(/×/g,"*").replace(/÷/g,"/").replace(/[+\-*\/]$/,"");
    var r=Function("return ("+expr+")")();
    if(isNaN(r)||!isFinite(r))return NaN;
    return Math.round(r*100)/100;
  }catch(e){return NaN;}
}
function hasOperator(){return /[+\-×÷]/.test(numVal);}
function numpad(){
  var lastCh=numVal.slice(-1);
  var ops=["+","-","×","÷"];
  var h='<div style="display:flex;gap:6px;margin-bottom:8px">';
  ops.forEach(function(op){
    var active=lastCh===op;
    h+='<button onclick="nkPress(\''+op+'\')" style="flex:1;background:'+(active?"#B8B5FF22":"#1E2030")+';border:1.5px solid '+(active?"#B8B5FF":"#2A2D3E")+';border-radius:11px;padding:10px 0;font-size:20px;font-weight:800;color:'+(active?"#B8B5FF":"#666")+';cursor:pointer;font-family:Cairo,sans-serif">'+op+'</button>';
  });
  h+='</div>';
  h+='<div class="numpad">';
  ["1","2","3","4","5","6","7","8","9",".","0","⌫"].forEach(function(k){h+='<button class="nk'+(k==="⌫"?" del":"")+'" onclick="nkPress(\''+k+'\')">'+k+'</button>';});
  h+='</div>';
  return h;
}
// ── NUM DISPLAY ──────────────────────────────────────────
function buildNumDisplay(activeCol){
  var h='<div style="text-align:center;margin-bottom:10px;min-height:58px">';
  var hasOp=hasOperator();
  if(hasOp){
    h+='<div style="font-size:18px;font-weight:700;color:#B8B5FF;letter-spacing:1px;margin-bottom:2px">'+(numVal||"0")+'</div>';
    var res=evalNumVal();
    var resStr=isNaN(res)?"خطأ":res.toLocaleString();
    h+='<div style="font-size:32px;font-weight:900;color:'+(isNaN(res)?"#FF6B6B":activeCol)+'">= '+resStr+' <span style="font-size:12px;color:#555">'+APP.currency+'</span></div>';
  } else {
    h+='<div style="font-size:38px;font-weight:900;color:'+(numVal?activeCol:"#333")+'">'+(numVal||"0")+' <span style="font-size:13px;color:#555">'+APP.currency+'</span></div>';
  }
  h+='</div>';
  return h;
}

// ── BUDGET ACTIONS (معدلة) ────────────────────────────────
function setCurM(mk){var vis=visibleMonths();if(vis.indexOf(mk)===-1)return;curM=mk;_needScrollChip=true;render();}
function setTab(t){curTab=t;render();}
function setCur(c){APP.currency=c;save();render();}
function selCur(el){setCur(el.dataset.c);}
function openModal(m){
  if((m==="addCharge"||m==="addIncome"||m==="savings")&&guardLocked())return;
  modal=m;numVal="";numStep="info";
  // إعادة تعيين خيارات التكرار عند فتح نافذة إضافة مصروف
  if(m==="addCharge"){
    recurType="none";
    recurMonths=[];
    recurYearlyMonth="";
  }
  render();
}
function closeModal(){modal=null;render();}
function bgClick(e){if(e.target===e.currentTarget){modal=null;render();}}
var _paidTap={id:null,timer:null};
function togglePaid(id){
  if(guardLocked())return;
  if(_paidTap.id===id){
    // second tap — confirm
    clearTimeout(_paidTap.timer);
    _paidTap={id:null,timer:null};
    var md=gm(curM);
    md.charges=md.charges.map(function(c){if(c.id!==id)return c;var nowPaid=!c.paid;return Object.assign({},c,{paid:nowPaid,paidAt:nowPaid?new Date().toLocaleString("ar-MA",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):null});});
    APP.months[curM]=md;save();render();
  } else {
    // first tap — wait for second
    clearTimeout(_paidTap.timer);
    _paidTap.id=id;
    toast("اضغط مرة ثانية للتأكيد ✓","w");
    _paidTap.timer=setTimeout(function(){_paidTap={id:null,timer:null};},1500);
  }
}
function nkPress(k){
  var ops=["+","-","×","÷"];
  if(k==="⌫"){numVal=numVal.slice(0,-1);}
  else if(ops.indexOf(k)!==-1){
    if(!numVal)return;
    var last=numVal.slice(-1);
    if(ops.indexOf(last)!==-1)numVal=numVal.slice(0,-1)+k;
    else numVal+=k;
  }
  else if(k==="."){
    var lastSeg=numVal.split(/[+\-×÷]/).pop();
    if(lastSeg.includes("."))return;
    if(!lastSeg)numVal+="0";
    numVal+=k;
  }
  else{if(numVal.length>=14)return;numVal+=k;}
  render();
}
function setIcon(ic){numIcon=ic;render();}
function setCol(c){numCol=c;render();}
function setRecurType(type){recurType=type;if(type!=="months")recurMonths=[];if(type!=="yearly")recurYearlyMonth="";render();}
function toggleRecurMonth(mStr){
  var idx = recurMonths.indexOf(mStr);
  if(idx===-1) recurMonths.push(mStr);
  else recurMonths.splice(idx,1);
  render();
}
function setYearlyMonth(m){recurYearlyMonth=m;render();}
function nextStep(){
  if(!numLabel.trim()){toast("أدخل الاسم أولاً","e");return;}
  if(recurType==="yearly"&&!recurYearlyMonth){toast("اختر الشهر للتكرار السنوي","e");return;}
  if(recurType==="months"&&recurMonths.length===0){toast("اختر شهراً واحداً على الأقل","e");return;}
  numStep="amount";numVal="";render();
}
function prevStep(){numStep="info";render();}
function saveItem(){
  if(guardLocked())return;
  var v=evalNumVal();
  if(!numLabel.trim()){toast("أدخل الاسم","e");return;}
  if(isNaN(v)||v<=0){toast("أدخل مبلغاً صحيحاً","e");return;}
  var md=gm(curM);
  var ni={id:Date.now()+"",label:numLabel.trim(),amount:v,icon:numIcon,color:numCol,paid:false};
  if(modal==="addCharge"){
    var curMo=curM.split("-")[1];
    var addToCurrentMonth=false;
    if(recurType==="none")          addToCurrentMonth=true;
    else if(recurType==="monthly")  addToCurrentMonth=true;
    else if(recurType==="yearly")   addToCurrentMonth=(recurYearlyMonth===curMo);
    else if(recurType==="months")   addToCurrentMonth=(recurMonths.indexOf(curMo)!==-1);
    if(addToCurrentMonth) md.charges.push(ni);
    // إذا كان هناك تكرار، أضف إلى القائمة المتكررة
    if(recurType!=="none"){
      var rec = {
        id: "rec_"+Date.now()+"_"+Math.random().toString(36).slice(2),
        label: numLabel.trim(),
        amount: v,
        icon: numIcon,
        color: numCol,
        startMonth: curM,
        type: recurType,
        months: recurType==="months"?recurMonths.slice():[],
        yearlyMonth: recurType==="yearly"?recurYearlyMonth:""
      };
      if(!APP.recurring) APP.recurring = [];
      APP.recurring.push(rec);
      toast("تمت الإضافة كمصروف متكرر ✓");
    } else {
      toast("تمت الإضافة ✓");
    }
  } else {
    md.incomes.push(ni);
    toast("تمت الإضافة ✓");
  }
  APP.months[curM]=md;save();modal=null;numStep="info";render();
}
function saveSavings(){
  if(guardLocked())return;
  var v=evalNumVal()||0;
  var md=gm(curM);
  var sp=md.incomes.reduce(function(s,i){return s+i.amount;},0)-md.charges.reduce(function(s,c){return s+c.amount;},0);
  if(v>sp&&sp>0)toast("يتجاوز الفائض المتاح!","w");
  md.savings=v;APP.months[curM]=md;save();modal=null;toast("تم حفظ الادخار ✓");render();
}
function openEdit(id,type){
  if(guardLocked())return;
  var md=gm(curM);var arr=type==="charge"?md.charges:md.incomes;var item=arr.find(function(x){return x.id===id;});
  if(!item)return;editId=id;editType=type;numVal=String(item.amount);numLabel=item.label;numIcon=item.icon;numCol=item.color;modal="editItem";render();
}
function saveEdit(){
  if(guardLocked())return;
  var v=evalNumVal();if(isNaN(v)||v<=0){toast("أدخل مبلغاً صحيحاً","e");return;}
  var md=gm(curM);var arr=editType==="charge"?md.charges:md.incomes;
  arr=arr.map(function(x){return x.id===editId?Object.assign({},x,{label:numLabel||x.label,amount:v,icon:numIcon,color:numCol}):x;});
  if(editType==="charge")md.charges=arr;else md.incomes=arr;APP.months[curM]=md;save();modal=null;toast("تم الحفظ ✓");render();
}
function askDel(id,type){if(guardLocked())return;pendingDelId=id;pendingDelType=type;modal="confirmDel";render();}
function doDelItem(){
  if(guardLocked())return;var md=gm(curM);
  if(pendingDelType==="charge")md.charges=md.charges.filter(function(x){return x.id!==pendingDelId;});
  else md.incomes=md.incomes.filter(function(x){return x.id!==pendingDelId;});
  APP.months[curM]=md;save();modal=null;toast("تم الحذف","e");render();
}
function doClear(){APP={currency:"MAD",months:{},persons:[],recurring:[]};save();modal=null;toast("تم مسح جميع البيانات","e");render();}
function doExport(){var d=new Date();var blob=new Blob([JSON.stringify(APP,null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="masarifi_"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+".json";a.click();URL.revokeObjectURL(url);toast("تم التصدير ✓");}
var _importedData=null;
function onFileChosen(input){var file=input.files[0];if(!file)return;var lbl=document.getElementById("fileNameLabel");if(lbl)lbl.textContent=file.name;var reader=new FileReader();reader.onload=function(e){try{var imp=JSON.parse(e.target.result);if(!imp.months){toast("ملف غير صالح","e");_importedData=null;return;}_importedData=imp;if(lbl)lbl.style.color="#06D6A0";}catch(err){toast("خطأ في قراءة الملف","e");_importedData=null;}};reader.readAsText(file);}
function doImportFile(){if(!_importedData){toast("اختر ملف JSON أولاً","e");return;}APP=_importedData;if(!APP.persons)APP.persons=[];if(!APP.recurring)APP.recurring=[];_importedData=null;save();modal=null;toast("تم الاستيراد بنجاح ✓");render();}
function deleteRecurring(recId){
  if(!APP.recurring) return;
  APP.recurring = APP.recurring.filter(function(r){return r.id!==recId;});
  save();
  toast("تم حذف المصروف المتكرر","e");
  render();
}

// ── PASSWORD ACTIONS ──────────────────────────────────────
function openPwdModal(mode){pwdVal="";pwdMode=mode;modal="pwd";render();}
function pwdKey(k){if(k==="⌫"){pwdVal=pwdVal.slice(0,-1);render();return;}if(k==="✓"){pwdConfirm();return;}if(pwdVal.length>=12)return;pwdVal+=k;render();}
function pwdConfirm(){if(pwdMode==="unlock")doPwdUnlock();else if(pwdMode==="set")doPwdSet();else if(pwdMode==="change-old")doPwdChangeVerify();else if(pwdMode==="change-new")doPwdChangeNew();else if(pwdMode==="remove")doPwdRemove();}
function doPwdUnlock(){if(!pwdVal){toast("أدخل كلمة المرور","e");return;}if(pwdVal!==getPwd()){toast("كلمة المرور خاطئة ✗","e");pwdVal="";render();return;}setUnlocked();modal=null;pwdVal="";toast("تم فتح القفل ✓ جلسة مؤقتة");render();}
function doPwdSet(){if(!pwdVal||pwdVal.length<1){toast("أدخل كلمة مرور","e");return;}setPwdStore(pwdVal);modal=null;pwdVal="";toast("تم تعيين كلمة المرور ✓");render();}
function doPwdChangeVerify(){if(pwdVal!==getPwd()){toast("كلمة المرور الحالية خاطئة ✗","e");pwdVal="";render();return;}pwdOldOk=true;pwdVal="";pwdMode="change-new";render();}
function doPwdChangeNew(){if(!pwdVal){toast("أدخل كلمة مرور جديدة","e");return;}setPwdStore(pwdVal);modal=null;pwdVal="";pwdOldOk=false;toast("تم تغيير كلمة المرور ✓");render();}
function doPwdRemove(){if(pwdVal!==getPwd()){toast("كلمة المرور خاطئة ✗","e");pwdVal="";render();return;}removePwd();reLock();modal=null;pwdVal="";toast("تمت إزالة كلمة المرور","w");render();}
function reLockNow(){reLock();toast("تم إعادة القفل 🔒");render();}

// ── NOTIFICATIONS ─────────────────────────────────────────
var _notifTimer=null;
function getUnpaidList(){var md=gm(tm());return md.charges.filter(function(c){return!c.paid;});}
function fireUnpaidNotif(){var unpaid=getUnpaidList();if(!unpaid.length)return;var cur=APP.currency;var total=unpaid.reduce(function(s,c){return s+c.amount;},0);var body=unpaid.slice(0,5).map(function(c){return c.icon+" "+c.label+" — "+c.amount.toLocaleString()+" "+cur;}).join("\n");if(unpaid.length>5)body+="\n…و"+(unpaid.length-5)+" آخرين";body+="\n\nالمجموع: "+total.toLocaleString()+" "+cur;try{new Notification("🔔 مصاريفي — "+unpaid.length+" مصروف غير مدفوع",{body:body,icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230F1117'/><text y='44' x='8' font-size='40'>💸</text></svg>",tag:"masarifi-unpaid",renotify:true});}catch(e){}}
function startNotifTimer(){stopNotifTimer();if(localStorage.getItem("masarifi_notif")!=="1")return;if(Notification.permission!=="granted")return;var minutes=parseInt(localStorage.getItem("masarifi_notif_interval")||"60");var ms=minutes*60*1000;fireUnpaidNotif();_notifTimer=setInterval(function(){if(localStorage.getItem("masarifi_notif")==="1")fireUnpaidNotif();else stopNotifTimer();},ms);}
function stopNotifTimer(){if(_notifTimer){clearInterval(_notifTimer);_notifTimer=null;}}
function setNotifInterval(minutes){localStorage.setItem("masarifi_notif_interval",String(minutes));if(localStorage.getItem("masarifi_notif")==="1"&&Notification.permission==="granted"){startNotifTimer();toast("فترة التذكير: كل "+minutes+" دقيقة");}render();}
function enableNotifs(){Notification.requestPermission().then(function(perm){if(perm==="granted"){localStorage.setItem("masarifi_notif","1");startNotifTimer();toast("تم تفعيل التذكيرات 🔔");}else toast("تم رفض الإشعارات","e");render()});}
function toggleNotifs(){var cur=localStorage.getItem("masarifi_notif")==="1";if(cur){localStorage.setItem("masarifi_notif","0");stopNotifTimer();toast("تم إيقاف التذكيرات","w");}else{localStorage.setItem("masarifi_notif","1");startNotifTimer();toast("تم تفعيل التذكيرات 🔔");}render();}

// ── START ─────────────────────────────────────────────────
(function(){var vis=visibleMonths();if(vis.indexOf(curM)===-1)curM=tm();})();
render();
setTimeout(function(){autoBackup();},3000);
setTimeout(function(){startNotifTimer();},1000);
</script>
